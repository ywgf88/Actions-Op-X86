#
# https://github.com/P3TERX/Actions-OpenWrt
#
# File: .github/workflows/openwrt-builder.yml
# Description: Build OpenWrt using GitHub Actions
#
# 本仓库改动：源码改为官方 openwrt/openwrt，版本 v25.12.6（openwrt-25.12 分支的 25.12.6 发布），
# 目标改为 x86/64 generic，并适配 25.12 起使用的 apk 打包机制、x86 镜像命名。
#
name: OpenWrt Builder

on:
  repository_dispatch:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  # 官方源码 + 25.12.6 发布版本（对应 openwrt-25.12 分支的 v25.12.6 标签）
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: v25.12.6
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  # x86 软路由没有 128M NAND 的限制，这里只防呆：单个镜像上限（MB）
  MAX_FIRMWARE_MB: 300
  # 编译并发：云 runner 只有 2~4 核，-j3 比 -j$(nproc) 更稳
  JOBS: 3
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH --depth 1 openwrt
        cd openwrt && git describe --tags --always || true
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Validate target config
      run: |
        cd openwrt
        make defconfig
        echo "=========== 关键配置检查 ==========="
        fail=0
        must_have() {
          if grep -q "^$1=y" .config; then
            echo "✓ $2"
          else
            echo "❌ 缺少 $2 ($1)"
            fail=1
          fi
        }
        # 目标板
        must_have CONFIG_TARGET_x86_64_DEVICE_generic "x86/64 generic 目标"
        if grep -q '^CONFIG_VERSION_NUMBER="25.12.6"' .config; then
          echo "✓ 版本号 25.12.6"
        else
          echo "⚠️ 版本号不是 25.12.6（仅影响镜像文件名）"
        fi
        # 中文包
        must_have CONFIG_PACKAGE_luci-i18n-base-zh-cn "luci-i18n-base-zh-cn"
        must_have CONFIG_PACKAGE_luci-i18n-firewall-zh-cn "luci-i18n-firewall-zh-cn"
        must_have CONFIG_PACKAGE_luci-i18n-argon-config-zh-cn "Argon 中文包"
        # 主题
        must_have CONFIG_PACKAGE_luci-theme-argon "Argon 主题"
        must_have CONFIG_PACKAGE_luci-theme-vantage "Vantage 主题"
        must_have CONFIG_PACKAGE_luci-theme-aurora "Aurora 主题"
        # 插件
        must_have CONFIG_PACKAGE_luci-app-run "luci-app-run"
        must_have CONFIG_PACKAGE_luci-app-quickfile "luci-app-quickfile"
        must_have CONFIG_PACKAGE_luci-app-partexp "luci-app-partexp"
        must_have CONFIG_PACKAGE_luci-app-passwall2 "PassWall2"
        must_have CONFIG_PACKAGE_luci-app-clashoo "Clashoo"
        must_have CONFIG_PACKAGE_luci-app-diskman "DiskMan"
        must_have CONFIG_PACKAGE_luci-app-dockerman "Docker 面板"
        must_have CONFIG_PACKAGE_docker "docker"
        # rootfs 分区大小（默认 104MB 装不下本配置的约 520MB 包，会卡在 root.ext4 打包）
        rootfs_partsize=$(grep -oP '^CONFIG_TARGET_ROOTFS_PARTSIZE=\K[0-9]+' .config || echo 0)
        if [ "${rootfs_partsize:-0}" -ge 512 ]; then
          echo "✓ rootfs 分区 ${rootfs_partsize}MB"
        else
          echo "❌ rootfs 分区只有 ${rootfs_partsize}MB，打包镜像时必然 out of space"
          fail=1
        fi
        echo "------------------------------------"
        echo "IPv6 组件 odhcp6c: $(grep -c '^CONFIG_PACKAGE_odhcp6c=y' .config || true) （期望 0）"
        echo "默认 IPv4 相关：$(grep -c '^CONFIG_PACKAGE_odhcp6c is not set' .config || true)"
        if [ "$fail" = "1" ]; then
          echo "❌ 有必需包未被选中，请查看上面的报错再改 .config / diy-part1.sh"
          exit 1
        fi
        echo "✅ 配置检查通过"

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8 || make download -j1
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo "$(nproc) cores, build with -j${JOBS}"
        make -j${JOBS} || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME || true
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(head -n1 DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Check firmware size
      if: steps.compile.outputs.status == 'success' && !cancelled()
      run: |
        cd openwrt/bin/targets/x86/64
        ls -lh
        fw=$(ls *squashfs-combined-efi.img.gz 2>/dev/null | head -1)
        if [ -z "$fw" ]; then
          echo "❌ 未找到 squashfs-combined-efi 镜像，请查看编译日志"
          exit 1
        fi
        for f in *squashfs-combined-efi.img.gz *squashfs-combined.img.gz *ext4-combined-efi.img.gz; do
          [ -f "$f" ] || continue
          size=$(stat -c %s "$f")
          mb=$((size / 1024 / 1024))
          echo "镜像 $f 体积 ${mb}MB，上限 ${MAX_FIRMWARE_MB}MB"
          if [ "$size" -gt $((MAX_FIRMWARE_MB * 1024 * 1024)) ]; then
            echo "❌ $f 超过 ${MAX_FIRMWARE_MB}MB"
            exit 1
          fi
        done

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/x86/64
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        {
          echo '## OpenWrt 25.12.6 / x86-64'
          echo ''
          echo '- 源码：openwrt/openwrt `v25.12.6`（openwrt-25.12 分支的 25.12.6 发布）'
          echo '- 目标：`x86/64` generic'
          echo '- 默认网络：IPv4（LAN `192.168.100.1/24`，WAN 为 DHCP，不含 DHCPv6 / RA）'
          echo '- 默认主题：Argon（另装 Vantage、Aurora，可在「系统 - 语言和界面」切换）'
          echo '- 中文包：base / firewall / dockerman / passwall2 / clashoo / argon 等'
          echo '- 插件：PassWall2、Clashoo、QuickFile、DiskMan、Partexp、Run、Docker(Dockerman)'
          echo ''
          echo '### 刷写'
          echo '下载 `openwrt-25.12.6-x86-64-generic-squashfs-combined-efi.img.gz`，解压后用 balenaEtcher / Rufus / dd 写入 U 盘或硬盘；UEFI 启动用 combined-efi，传统 BIOS 用 combined。'
          echo ''
          echo '首次开机后访问 http://192.168.100.1'
        } > release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*
        overwrite_files: true

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      continue-on-error: true
      with:
        retain_days: 0
        keep_minimum_runs: 2

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      continue-on-error: true
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
